[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineer-tabtii"
version = "0.1.0"
description = "Context-Engineer for local AI Agents. Zero-config RAG for Ollama with automatic chunking, token-budget awareness, and source citation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Torben", email = "torbi95@gmail.com" }
]
keywords = ["rag", "ollama", "llm", "ai-agents", "context", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "twine>=5.0.0",
    "build>=1.2.0",
]

[project.scripts]
context = "context_engineer.cli:main"

[project.urls]
Homepage = "https://github.com/Tabtii/context-engineer"
Repository = "https://github.com/Tabtii/context-engineer"
Documentation = "https://github.com/Tabtii/context-engineer#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_engineer*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
